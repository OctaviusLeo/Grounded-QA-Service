# Grounded QA Service stack. One command starts everything: docker compose up
name: gqa

services:
  ollama:
    # Model_Server: OpenAI-compatible endpoint at http://127.0.0.1:8090/v1 on the host.
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      # The 4,096-token default can truncate a five-passage prompt.
      OLLAMA_CONTEXT_LENGTH: "8192"
      # One model in VRAM at a time; requests are served one after another.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    ports:
      - "127.0.0.1:8090:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  model-init:
    # Pulls the serving model into the shared volume once; a no-op when it is already present.
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "granite3.3:8b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    # FastAPI service at http://127.0.0.1:8000 (answer, answer/stream, health, metrics).
    build: .
    image: gqa-api:local
    environment:
      GQA_MODEL_BASE_URL: http://ollama:11434/v1
      # Secrets come only from the environment (none is required for the local model).
      GQA_MODEL_API_KEY: ${GQA_MODEL_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama:
    name: gqa_ollama
