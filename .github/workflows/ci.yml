# Unit tests run on a GitHub-hosted runner; the quality gate needs the
# GPU model server, so it runs on the self-hosted runner `desktop-gpu` (labels: self-hosted, gpu).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit and property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Lint (Pyflakes and pycodestyle errors, rules in pyproject.toml)
        run: uvx ruff@0.17.1 check .
      - name: Install the locked environment
        run: uv sync --frozen --all-groups
      - name: Run the suite with the coverage gate
        run: PYTHON=.venv/bin/python bash scripts/test_unit.sh
      - name: Check that every README number traces to a generated file
        run: PYTHONPATH=. .venv/bin/python scripts/check_readme.py

  quality:
    name: Evaluation subset and regression gate
    needs: unit
    # Only pushes to main and pull requests from branches of this repository reach the self-hosted
    # runner. A fork's pull request runs its own copy of this file and could drop this condition, so
    # outside contributors' runs also need the owner's approval (a repository setting).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Evaluate the CI subset and compare with results/baseline.json
        run: bash scripts/ci_quality.sh
