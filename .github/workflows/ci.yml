# Unit tests run on a GitHub-hosted runner; the quality gate needs the
# GPU model server, so it runs on the self-hosted runner `desktop-gpu` (labels: self-hosted, gpu).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit and property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: .venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - name: Install the locked environment
        run: uv sync --frozen --all-groups
      - name: Run the suite with the coverage gate
        run: PYTHON=.venv/bin/python bash scripts/test_unit.sh

  quality:
    name: Evaluation subset and regression gate
    needs: unit
    # Never run a fork's pull request on the self-hosted runner: only pushes to main and pull
    # requests from branches of this repository reach it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate the CI subset and compare with results/baseline.json
        run: bash scripts/ci_quality.sh
